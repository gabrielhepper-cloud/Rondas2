<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Rondas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; color: #ffffff !important; }
        .texto-resaltado { text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9); }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col justify-between p-4">

    <!-- CABECERA -->
    <header class="bg-slate-950 p-4 text-center border-b-2 border-slate-700 rounded-xl mb-4">
        <h1 class="text-xl font-black text-white">CONTROL DE RONDAS</h1>
        <p class="text-xs text-slate-400 mt-1">SISTEMA GPS Y REGISTRO</p>
    </header>

    <main class="max-w-md mx-auto w-full flex-grow flex flex-col gap-4">
        
        <!-- ESTADO -->
        <div class="bg-slate-950 p-5 rounded-xl border-2 border-slate-700 text-center">
            <h2 class="text-xs font-bold text-slate-400">ESTADO DEL RECORRIDO</h2>
            <div id="estadoTexto" class="text-2xl font-black mt-1 text-white">NO INICIADO</div>
            <div id="infoRonda" class="text-sm font-bold text-emerald-400 mt-2 hidden">
                PUESTOS: <span id="contadorPuestos" class="text-white bg-slate-800 px-2 py-0.5 rounded">0</span>
            </div>
        </div>

        <!-- BOTONES PRINCIPALES -->
        <button id="btnInicio" type="button" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-5 rounded-xl text-lg shadow-lg border-b-4 border-emerald-800 active:scale-95 transition-all">
            ▶ INICIAR RECORRIDO
        </button>

        <button id="btnPuesto" type="button" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-6 rounded-xl text-xl shadow-lg border-b-4 border-blue-800 hidden active:scale-95 transition-all">
            📍 MARCAR PUESTO <span id="numPuesto">1</span>
        </button>

        <button id="btnFin" type="button" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 rounded-xl text-lg shadow-lg border-b-4 border-rose-800 hidden active:scale-95 transition-all">
            ⏹ TERMINAR RECORRIDO
        </button>

    </main>

    <!-- MODAL INGRESO NOMBRE -->
    <div id="modalNombre" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-950 border-2 border-slate-700 p-6 rounded-2xl max-w-xs w-full text-center">
            <h3 class="text-lg font-black text-white mb-2">NUEVA RONDA</h3>
            <p class="text-xs text-slate-300 mb-4">INGRESA TU NOMBRE Y APELLIDO:</p>
            <input type="text" id="inputNombre" class="w-full bg-slate-800 text-white font-bold p-3 rounded-lg border border-slate-600 mb-4 text-center uppercase focus:outline-none focus:border-emerald-500">
            <div class="grid grid-cols-2 gap-2">
                <button id="btnCancelarModal" class="bg-slate-800 text-white font-bold py-2 rounded-lg text-sm">CANCELAR</button>
                <button id="btnConfirmarInicio" class="bg-emerald-600 text-white font-bold py-2 rounded-lg text-sm border-b-2 border-emerald-800">COMENZAR</button>
            </div>
        </div>
    </div>

    <script>
        let enRecorrido = false;
        let idRonda = null;
        let contador = 0;
        let vigilador = "";

        // ASIGNACIÓN DE EVENTOS DIRECTOS AL CARGAR EL DOM
        document.addEventListener("DOMContentLoaded", () => {
            const btnInicio = document.getElementById('btnInicio');
            const btnPuesto = document.getElementById('btnPuesto');
            const btnFin = document.getElementById('btnFin');
            const modal = document.getElementById('modalNombre');
            const btnCancelar = document.getElementById('btnCancelarModal');
            const btnConfirmar = document.getElementById('btnConfirmarInicio');

            btnInicio.addEventListener('click', () => {
                document.getElementById('inputNombre').value = "";
                modal.classList.remove('hidden');
            });

            btnCancelar.addEventListener('click', () => {
                modal.classList.add('hidden');
            });

            btnConfirmar.addEventListener('click', async () => {
                const nombre = document.getElementById('inputNombre').value.trim();
                if (!nombre) {
                    alert("Debes ingresar un nombre para continuar.");
                    return;
                }
                modal.classList.add('hidden');
                await ejecutarInicio(nombre.toUpperCase());
            });

            btnPuesto.addEventListener('click', marcarPuesto);
            btnFin.addEventListener('click', finalizarRonda);
        });

        function obtenerUbicacionGPS() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject("Tu navegador no soporta la función de Geolocalización.");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                    (err) => {
                        let msg = "Error al obtener GPS.";
                        if (err.code === 1) msg = "Permiso de ubicación denegado. Actívalo en la configuración de tu navegador/celular.";
                        if (err.code === 2) msg = "Ubicación no disponible. Revisa si tienes el GPS activado.";
                        if (err.code === 3) msg = "Tiempo de espera agotado al buscar GPS.";
                        reject(msg);
                    },
                    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
                );
            });
        }

        async function ejecutarInicio(nombre) {
            const btnInicio = document.getElementById('btnInicio');
            btnInicio.disabled = true;
            btnInicio.innerText = "BUSCANDO GPS...";

            try {
                const gps = await obtenerUbicacionGPS();
                vigilador = nombre;
                idRonda = "Ronda #" + Date.now().toString().slice(-5);
                enRecorrido = true;
                contador = 0;

                actualizarVista();
                alert(`Ronda iniciada correctamente en las coordenadas: ${gps.lat}, ${gps.lon}`);
            } catch (error) {
                alert(error);
            } finally {
                btnInicio.disabled = false;
                btnInicio.innerText = "▶ INICIAR RECORRIDO";
            }
        }

        async function marcarPuesto() {
            const btnPuesto = document.getElementById('btnPuesto');
            btnPuesto.disabled = true;
            btnPuesto.innerText = "REGISTRANDO...";

            try {
                const gps = await obtenerUbicacionGPS();
                contador++;
                document.getElementById('contadorPuestos').innerText = contador;
                document.getElementById('numPuesto').innerText = contador + 1;
                alert(`Puesto ${contador} registrado con éxito.`);
            } catch (error) {
                alert(error);
            } finally {
                btnPuesto.disabled = false;
                btnPuesto.innerHTML = `📍 MARCAR PUESTO <span id="numPuesto">${contador + 1}</span>`;
            }
        }

        function finalizarRonda() {
            if (confirm("¿Deseas finalizar la ronda actual?")) {
                enRecorrido = false;
                actualizarVista();
                alert("Ronda finalizada.");
            }
        }

        function actualizarVista() {
            if (enRecorrido) {
                document.getElementById('btnInicio').classList.add('hidden');
                document.getElementById('btnPuesto').classList.remove('hidden');
                document.getElementById('btnFin').classList.remove('hidden');
                document.getElementById('infoRonda').classList.remove('hidden');
                document.getElementById('estadoTexto').innerText = "EN RECORRIDO";
                document.getElementById('estadoTexto').className = "text-2xl font-black mt-1 text-emerald-400 animate-pulse";
            } else {
                document.getElementById('btnInicio').classList.remove('hidden');
                document.getElementById('btnPuesto').classList.add('hidden');
                document.getElementById('btnFin').classList.add('hidden');
                document.getElementById('infoRonda').classList.add('hidden');
                document.getElementById('estadoTexto').innerText = "NO INICIADO";
                document.getElementById('estadoTexto').className = "text-2xl font-black mt-1 text-white";
            }
        }
    </script>
</body>
</html>
