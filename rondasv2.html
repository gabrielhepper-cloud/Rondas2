<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Rondas - Reporte con Mapa de Ruta</title>
    
    <!-- Configuración PWA básica -->
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .blanco-absoluto, label, p, span, div, h1, h2, h3, input, footer {
            color: #ffffff !important;
        }
        .texto-resaltado {
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col justify-between blanco-absoluto">

    <!-- CABECERA DE LA APP -->
    <header class="bg-slate-950 p-4 text-center border-b-2 border-slate-700 shadow-md">
        <h1 class="text-2xl font-black tracking-widest text-white texto-resaltado">CONTROL DE RONDAS</h1>
        <p class="text-sm font-black text-white mt-1 uppercase tracking-wider texto-resaltado">RASTREO DE RUTA EN TIEMPO REAL</p>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="p-4 max-w-md mx-auto w-full flex-grow flex flex-col justify-start gap-5">
        
        <!-- INDICADOR DE VIGILADOR ACTIVO -->
        <div id="panelVigiladorActivo" class="bg-slate-950 p-3 rounded-xl border-2 border-slate-700 shadow-lg text-center hidden">
            <span class="text-xs font-black uppercase tracking-wider text-slate-400">VIGILADOR EN RECORRIDO:</span>
            <p id="nombreVigiladorEnCurso" class="text-lg font-black text-white uppercase mt-0.5 tracking-wide texto-resaltado"></p>
        </div>

        <!-- ESTADO ACTUAL -->
        <div class="bg-slate-950 p-5 rounded-xl border-2 border-slate-700 shadow-inner text-center">
            <h2 class="text-xs font-black uppercase tracking-widest text-white">ESTADO DEL RECORRIDO</h2>
            <div id="estadoTexto" class="text-2xl font-black mt-2 text-white tracking-wide texto-resaltado">NO INICIADO</div>
            <div id="infoRondaActual" class="text-sm font-black text-white mt-3 hidden">
                PUESTOS MARCADOS: <span id="contadorPuestos" class="text-xl font-black text-white bg-slate-900 px-3 py-1 rounded border-2 border-slate-700">0</span>
                <p class="text-xs font-black text-emerald-400 mt-2">📡 RUTA GPS GRABÁNDOSE...</p>
            </div>
        </div>

        <!-- BOTONES DE ACCIÓN -->
        <div class="grid grid-cols-1 gap-4">
            <!-- Botón Iniciar -->
            <button id="btnInicio" onclick="solicitarInicio()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-5 px-6 rounded-xl shadow-xl transition-all transform active:scale-95 text-xl tracking-wider texto-resaltado border-b-4 border-emerald-800">
                ▶ INICIAR RECORRIDO
            </button>

            <!-- Botón Marcar Puesto -->
            <button id="btnPuesto" onclick="marcarPuesto()" class="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:opacity-40 text-white font-black py-7 px-6 rounded-xl shadow-xl transition-all transform active:scale-95 text-2xl tracking-wider texto-resaltado border-b-4 border-blue-800 hidden">
                📍 MARCAR PUESTO <span id="siguientePuestoNum" class="bg-slate-950 px-3 py-0.5 rounded ml-1 border border-slate-600 text-white">1</span>
            </button>

            <!-- Botón Finalizar -->
            <button id="btnFin" onclick="solicitarFin()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-black py-4 px-6 rounded-xl shadow-xl transition-all transform active:scale-95 text-lg tracking-wider texto-resaltado border-b-4 border-rose-800 hidden">
                ⏹ TERMINAR RECORRIDO
            </button>
        </div>

        <hr class="border-2 border-slate-800 my-1">

        <!-- PANEL DE ADMINISTRACIÓN -->
        <div class="bg-slate-950 p-5 rounded-xl border-2 border-slate-700 shadow-lg">
            <h3 class="text-sm font-black uppercase tracking-widest text-white mb-4 text-center border-b border-slate-800 pb-2">GENERAR REPORTE Y RUTA PDF</h3>
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-xs font-black uppercase tracking-wider text-white mb-1">FECHA DESDE:</label>
                    <input type="date" id="fechaDesde" class="w-full bg-slate-800 text-white font-black text-sm rounded-lg p-2.5 border-2 border-slate-600 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-wider text-white mb-1">FECHA HASTA:</label>
                    <input type="date" id="fechaHasta" class="w-full bg-slate-800 text-white font-black text-sm rounded-lg p-2.5 border-2 border-slate-600 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- BOTÓN EXPORTAR -->
            <button onclick="exportarPDF()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-3 px-4 rounded-xl text-md tracking-wider transition-colors shadow-lg texto-resaltado border-b-4 border-purple-800">
                📄 EXPORTAR A PDF CON RUTAS
            </button>
        </div>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-slate-950 p-3 text-center text-xs font-black uppercase tracking-widest border-t border-slate-800">
        DATOS ALMACENADOS LOCALMENTE EN EL DISPOSITIVO.
    </footer>

    <!-- MODAL PERSONALIZADO -->
    <div id="modalCustom" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-950 border-2 border-slate-700 p-6 rounded-2xl max-w-xs w-full shadow-2xl text-center">
            <h3 id="modalTitulo" class="text-lg font-black uppercase tracking-wider text-white mb-3">INICIAR RECORRIDO</h3>
            <p id="modalMensaje" class="text-sm font-black text-white mb-4">POR FAVOR, INGRESA TU NOMBRE Y APELLIDO:</p>
            
            <input type="text" id="modalInput" placeholder="NOMBRE Y APELLIDO" class="w-full bg-slate-800 text-white font-black text-sm rounded-lg p-3 border-2 border-slate-600 focus:outline-none focus:border-emerald-500 uppercase mb-5 text-center">
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="cerrarModal()" class="bg-slate-800 hover:bg-slate-700 text-white font-black py-2.5 px-4 rounded-xl border border-slate-600 text-sm">CANCELAR</button>
                <button id="modalBtnAceptar" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 px-4 rounded-xl text-sm border-b-2 border-emerald-800">ACEPTAR</button>
            </div>
        </div>
    </div>

    <!-- LÓGICA DEL SISTEMA -->
    <script>
        let enRecorrido = false;
        let idRondaActual = null;
        let contadorPuestos = 0;
        let vigiladorActual = "";
        let watchGPSId = null;
        let rutaCoordenadas = [];

        window.onload = function() {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fechaDesde').value = hoy;
            document.getElementById('fechaHasta').value = hoy;

            const rondaGuardada = localStorage.getItem('ronda_activa');
            if (rondaGuardada) {
                const datos = JSON.parse(rondaGuardada);
                enRecorrido = true;
                idRondaActual = datos.idRonda;
                contadorPuestos = datos.contador;
                vigiladorActual = datos.vigilador || "";
                rutaCoordenadas = datos.ruta || [];
                iniciarRastreoContinuo();
                actualizarInterfaz();
            }
        };

        function abrirModal({ titulo, mensaje, mostrarInput, placeholder, textoAceptar, accionAceptar }) {
            document.getElementById('modalTitulo').innerText = titulo;
            document.getElementById('modalMensaje').innerText = mensaje;
            
            const input = document.getElementById('modalInput');
            if (mostrarInput) {
                input.classList.remove('hidden');
                input.value = "";
                input.placeholder = placeholder || "";
                setTimeout(() => input.focus(), 100);
            } else {
                input.classList.add('hidden');
            }

            const btnAceptar = document.getElementById('modalBtnAceptar');
            btnAceptar.innerText = textoAceptar || "ACEPTAR";
            btnAceptar.onclick = function() {
                accionAceptar();
            };

            document.getElementById('modalCustom').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modalCustom').classList.add('hidden');
        }

        function solicitarInicio() {
            abrirModal({
                titulo: "NUEVA RONDA",
                mensaje: "POR FAVOR, INGRESA TU NOMBRE Y APELLIDO PARA COMENZAR:",
                mostrarInput: true,
                placeholder: "NOMBRE Y APELLIDO",
                textoAceptar: "INICIAR",
                accionAceptar: function() {
                    const nombre = document.getElementById('modalInput').value.trim();
                    if (!nombre) {
                        alert("Debes ingresar Nombre y Apellido.");
                        return;
                    }
                    cerrarModal();
                    iniciarRecorrido(nombre.toUpperCase());
                }
            });
        }

        function solicitarFin() {
            abrirModal({
                titulo: "TERMINAR RONDA",
                mensaje: "¿ESTÁ SEGURO QUE DESEA CERRAR EL RECORRIDO ACTUAL?",
                mostrarInput: false,
                textoAceptar: "SÍ, TERMINAR",
                accionAceptar: function() {
                    cerrarModal();
                    finalizarRecorrido();
                }
            });
        }

        function iniciarRastreoContinuo() {
            if (navigator.geolocation) {
                watchGPSId = navigator.geolocation.watchPosition(
                    (position) => {
                        const punto = [position.coords.latitude, position.coords.longitude];
                        if (rutaCoordenadas.length === 0 || 
                            rutaCoordenadas[rutaCoordenadas.length - 1][0] !== punto[0] ||
                            rutaCoordenadas[rutaCoordenadas.length - 1][1] !== punto[1]) {
                            rutaCoordenadas.push(punto);
                            guardarEstadoRondaActiva();
                        }
                    },
                    (error) => console.error("Error rastreo continuo:", error),
                    { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
                );
            }
        }

        function detenerRastreoContinuo() {
            if (watchGPSId !== null) {
                navigator.geolocation.clearWatch(watchGPSId);
                watchGPSId = null;
            }
        }

        function actualizarInterfaz() {
            const btnInicio = document.getElementById('btnInicio');
            const btnPuesto = document.getElementById('btnPuesto');
            const btnFin = document.getElementById('btnFin');
            const estadoTexto = document.getElementById('estadoTexto');
            const infoRondaActual = document.getElementById('infoRondaActual');
            const siguientePuestoNum = document.getElementById('siguientePuestoNum');
            const contPuestosText = document.getElementById('contadorPuestos');
            const panelVigilador = document.getElementById('panelVigiladorActivo');
            const nombreVigiladorEnCurso = document.getElementById('nombreVigiladorEnCurso');

            if (enRecorrido) {
                btnInicio.classList.add('hidden');
                btnPuesto.classList.remove('hidden');
                btnFin.classList.remove('hidden');
                estadoTexto.innerText = "EN RECORRIDO";
                estadoTexto.className = "text-2xl font-black mt-2 text-white tracking-wide animate-pulse texto-resaltado";
                infoRondaActual.classList.remove('hidden');
                contPuestosText.innerText = contadorPuestos;
                siguientePuestoNum.innerText = contadorPuestos + 1;

                if (vigiladorActual) {
                    nombreVigiladorEnCurso.innerText = vigiladorActual;
                    panelVigilador.classList.remove('hidden');
                }
            } else {
                btnInicio.classList.remove('hidden');
                btnPuesto.classList.add('hidden');
                btnFin.classList.add('hidden');
                estadoTexto.innerText = "NO INICIADO";
                estadoTexto.className = "text-2xl font-black mt-2 text-white tracking-wide texto-resaltado";
                infoRondaActual.classList.add('hidden');
                panelVigilador.classList.add('hidden');
            }
        }

        function obtenerGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    alert("Tu navegador no soporta Geo-localización.");
                    resolve({ lat: "No Soportado", lon: "No Soportado" });
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({ lat: position.coords.latitude, lon: position.coords.longitude });
                    },
                    (error) => {
                        alert("Error al obtener GPS. Activa la ubicación.");
                        resolve({ lat: "Sin Permiso", lon: "Sin Permiso" });
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        async function iniciarRecorrido(nombreIngresado) {
            vigiladorActual = nombreIngresado;

            document.getElementById('btnInicio').disabled = true;
            document.getElementById('btnInicio').innerText = "OBTENIENDO GPS...";

            const gps = await obtenerGPS();
            const ahora = new Date();
            
            idRondaActual = "Ronda #" + ahora.getTime().toString().slice(-6);
            contadorPuestos = 0;
            enRecorrido = true;
            rutaCoordenadas = [];

            if (typeof gps.lat === 'number') {
                rutaCoordenadas.push([gps.lat, gps.lon]);
            }

            const registroInicio = {
                idRonda: idRondaActual,
                vigilador: vigiladorActual,
                fecha: ahora.toISOString().split('T')[0],
                hora: ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
                evento: "INICIO RECORRIDO",
                coordenadas: gps.lat !== "Sin Permiso" && gps.lat !== "No Soportado" ? `${gps.lat}, ${gps.lon}` : "N/A",
                mapaLink: gps.lat !== "Sin Permiso" && typeof gps.lat === 'number' ? `https://maps.google.com/?q=${gps.lat},${gps.lon}` : ""
            };

            guardarRegistro(registroInicio);
            iniciarRastreoContinuo();
            guardarEstadoRondaActiva();
            
            document.getElementById('btnInicio').disabled = false;
            document.getElementById('btnInicio').innerText = "▶ INICIAR RECORRIDO";
            
            actualizarInterfaz();
        }

        async function marcarPuesto() {
            const btnPuesto = document.getElementById('btnPuesto');
            btnPuesto.disabled = true;
            const originalText = btnPuesto.innerHTML;
            btnPuesto.innerText = "LOCALIZANDO...";

            const gps = await obtenerGPS();
            const ahora = new Date();
            contadorPuestos++;

            if (typeof gps.lat === 'number') {
                rutaCoordenadas.push([gps.lat, gps.lon]);
            }

            const registroPuesto = {
                idRonda: idRondaActual,
                vigilador: vigiladorActual,
                fecha: ahora.toISOString().split('T')[0],
                hora: ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
                evento: `Puesto ${contadorPuestos}`,
                coordenadas: gps.lat !== "Sin Permiso" && gps.lat !== "No Soportado" ? `${gps.lat}, ${gps.lon}` : "N/A",
                mapaLink: gps.lat !== "Sin Permiso" && typeof gps.lat === 'number' ? `https://maps.google.com/?q=${gps.lat},${gps.lon}` : ""
            };

            guardarRegistro(registroPuesto);
            guardarEstadoRondaActiva();

            btnPuesto.disabled = false;
            btnPuesto.innerHTML = originalText;

            actualizarInterfaz();
        }

        async function finalizarRecorrido() {
            const btnFin = document.getElementById('btnFin');
            btnFin.disabled = true;
            btnFin.innerText = "CERRANDO...";

            detenerRastreoContinuo();
            const gps = await obtenerGPS();
            const ahora = new Date();

            if (typeof gps.lat === 'number') {
                rutaCoordenadas.push([gps.lat, gps.lon]);
            }

            const registroFin = {
                idRonda: idRondaActual,
                vigilador: vigiladorActual,
                fecha: ahora.toISOString().split('T')[0],
                hora: ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
                evento: "FIN RECORRIDO",
                coordenadas: gps.lat !== "Sin Permiso" && gps.lat !== "No Soportado" ? `${gps.lat}, ${gps.lon}` : "N/A",
                mapaLink: gps.lat !== "Sin Permiso" && typeof gps.lat === 'number' ? `https://maps.google.com/?q=${gps.lat},${gps.lon}` : "",
                rutaCompleta: rutaCoordenadas
            };

            guardarRegistro(registroFin);
            
            localStorage.removeItem('ronda_activa');
            enRecorrido = false;
            idRondaActual = null;
            contadorPuestos = 0;
            vigiladorActual = "";
            rutaCoordenadas = [];

            btnFin.disabled = false;
            btnFin.innerText = "⏹ TERMINAR RECORRIDO";

            actualizarInterfaz();
        }

        function guardarRegistro(nuevoRegistro) {
            let registros = JSON.parse(localStorage.getItem('rondas_logs')) || [];
            registros.push(nuevoRegistro);
            localStorage.setItem('rondas_logs', JSON.stringify(registros));
        }

        function guardarEstadoRondaActiva() {
            const estado = { idRonda: idRondaActual, contador: contadorPuestos, vigilador: vigiladorActual, ruta: rutaCoordenadas };
            localStorage.setItem('ronda_activa', JSON.stringify(estado));
        }

        function exportarPDF() {
            const desde = document.getElementById('fechaDesde').value;
            const hasta = document.getElementById('fechaHasta').value;

            if (!desde || !hasta) {
                alert("Por favor, selecciona el rango de fechas.");
                return;
            }

            const todosLosRegistros = JSON.parse(localStorage.getItem('rondas_logs')) || [];
            const filtrados = todosLosRegistros.filter(reg => reg.fecha >= desde && reg.fecha <= hasta);

            if (filtrados.length === 0) {
                alert("No se encontraron registros en el rango de fechas seleccionado.");
                return;
            }

            const rondasAgrupadas = {};
            filtrados.forEach(reg => {
                if (!rondasAgrupadas[reg.idRonda]) {
                    rondasAgrupadas[reg.idRonda] = {
                        vigilador: reg.vigilador,
                        fecha: reg.fecha,
                        eventos: [],
                        ruta: []
                    };
                }
                rondasAgrupadas[reg.idRonda].eventos.push(reg);
                if (reg.rutaCompleta && reg.rutaCompleta.length > 0) {
                    rondasAgrupadas[reg.idRonda].ruta = reg.rutaCompleta;
                }
            });

            const ventanaImpresion = window.open('', '_blank');
            let contenidoRondas = '';

            Object.keys(rondasAgrupadas).forEach((idRondaKey, idx) => {
                const ronda = rondasAgrupadas[idRondaKey];
                
                let tablaHTML = '';
                ronda.eventos.forEach(reg => {
                    const linkMapa = reg.mapaLink ? `<a href="${reg.mapaLink}" target="_blank" style="color: #0284c7; font-weight: bold;">Ver Punto ➔</a>` : 'N/A';
                    tablaHTML += `
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 8px; text-align: center;">${reg.fecha.split('-').reverse().join('/')}</td>
                            <td style="padding: 8px; text-align: center;">${reg.hora}</td>
                            <td style="padding: 8px; text-align: left; font-weight: 600;">${reg.evento}</td>
                            <td style="padding: 8px; text-align: left; font-size: 11px; font-family: monospace;">${reg.coordenadas}</td>
                            <td style="padding: 8px; text-align: center;">${linkMapa}</td>
                        </tr>
                    `;
                });

                // ENLACE DIRECTO A MAPA VISUAL SIN MODO "DIRECCIONES/PARADAS"
                let linkRutaGoogle = 'N/A';
                if (ronda.ruta.length > 0) {
                    const centro = `${ronda.ruta[0][0]},${ronda.ruta[0][1]}`;
                    // Abre la ubicación exacta en el mapa satelital sin calcular trayectos por calles
                    const urlGmaps = `https://www.google.com/maps/search/?api=1&query=${centro}`;
                    linkRutaGoogle = `<a href="${urlGmaps}" target="_blank" class="btn-gmaps">📍 ABRIR UBICACIÓN EN GOOGLE MAPS</a>`;
                }

                contenidoRondas += `
                    <div class="ronda-card">
                        <div class="ronda-header">
                            <div>
                                <h2>${idRondaKey} - VIGILADOR: ${ronda.vigilador}</h2>
                                <p>FECHA: ${ronda.fecha.split('-').reverse().join('/')}</p>
                            </div>
                            <div>${linkRutaGoogle}</div>
                        </div>

                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 15%;">Fecha</th>
                                    <th style="width: 15%;">Hora</th>
                                    <th style="width: 30%;">Evento / Puesto</th>
                                    <th style="width: 25%;">Coordenadas</th>
                                    <th style="width: 15%;">Link GPS</th>
                                </tr>
                            </thead>
                            <tbody>${tablaHTML}</tbody>
                        </table>

                        ${ronda.ruta.length > 1 ? `<div id="mapa_${idx}" class="mapa-box"></div>` : '<p style="font-size:11px; color:#64748b; padding:10px;">Ruta continua no registrada para este recorrido.</p>'}
                    </div>
                `;
            });

            ventanaImpresion.document.write(`
                <html>
                <head>
                    <title>Reporte de Rondas con Ruta de Recorrido</title>
                    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
                    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>
                    <style>
                        @page { size: A4 portrait; margin: 10mm; }
                        body { font-family: Arial, sans-serif; color: #1e293b; margin: 0; padding: 0; background-color: #ffffff; }
                        .header-main { background-color: #0f172a; color: #ffffff; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
                        .header-main h1 { margin: 0; font-size: 18px; color: #ffffff; }
                        .header-main p { margin: 3px 0 0 0; font-size: 11px; color: #cbd5e1; }
                        .ronda-card { border: 2px solid #0f172a; border-radius: 8px; margin-bottom: 20px; padding: 12px; page-break-inside: avoid; }
                        .ronda-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0f172a; padding-bottom: 8px; margin-bottom: 10px; }
                        .ronda-header h2 { margin: 0; font-size: 14px; color: #0f172a; }
                        .ronda-header p { margin: 2px 0 0 0; font-size: 11px; color: #64748b; font-weight: bold; }
                        .btn-gmaps { background-color: #0284c7; color: #ffffff !important; padding: 6px 10px; border-radius: 4px; text-decoration: none; font-size: 10px; font-weight: bold; }
                        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
                        th { background-color: #1e293b; color: #ffffff; padding: 8px; font-size: 10px; text-transform: uppercase; }
                        tr:nth-child(even) { background-color: #f8fafc; }
                        .mapa-box { width: 100%; height: 260px; border-radius: 6px; border: 1px solid #cbd5e1; margin-top: 8px; }
                    </style>
                </head>
                <body>
                    <div class="header-main">
                        <h1>AUDITORÍA DE CONTROL DE RONDAS Y RUTAS RECORRIDAS</h1>
                        <p>Generado desde el ${desde.split('-').reverse().join('/')} hasta el ${hasta.split('-').reverse().join('/')}</p>
                    </div>

                    ${contenidoRondas}

                    <script>
                        window.onload = function() {
                            const rondasData = ${JSON.stringify(rondasAgrupadas)};
                            let keys = Object.keys(rondasData);

                            keys.forEach((key, idx) => {
                                const ronda = rondasData[key];
                                if (ronda.ruta && ronda.ruta.length > 1) {
                                    const map = L.map('mapa_' + idx, { attributionControl: false, zoomControl: false });
                                    
                                    // Utiliza la capa de mapa satelital para ver claramente calles internas de barrios
                                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                                        maxZoom: 19
                                    }).addTo(map);

                                    // Trazado de la ruta EXACTA sin recálculo de calles
                                    const polyline = L.polyline(ronda.ruta, { color: '#00ffff', weight: 4, opacity: 0.9 }).addTo(map);

                                    // Dibujar cada Puesto marcado exactamente donde se registró
                                    let contadorP = 1;
                                    ronda.eventos.forEach(ev => {
                                        if (ev.coordenadas && ev.coordenadas !== "N/A") {
                                            let parts = ev.coordenadas.split(',');
                                            let lat = parseFloat(parts[0]);
                                            let lon = parseFloat(parts[1]);
                                            
                                            let colorMarker = ev.evento.startsWith("INICIO") ? '#22c55e' : ev.evento.startsWith("FIN") ? '#ef4444' : '#3b82f6';
                                            let labelText = ev.evento.startsWith("Puesto") ? `P${contadorP++}` : ev.evento;

                                            L.circleMarker([lat, lon], {
                                                color: '#ffffff',
                                                radius: 8,
                                                fillColor: colorMarker,
                                                fillOpacity: 1,
                                                weight: 2
                                            }).addTo(map).bindPopup(`<b>${labelText}</b><br>${ev.hora}`);
                                        }
                                    });

                                    map.fitBounds(polyline.getBounds(), { padding: [25, 25] });
                                }
                            });

                            setTimeout(() => { window.print(); }, 1200);
                        };
                    <\/script>
                </body>
                </html>
            `);
            ventanaImpresion.document.close();
        }
    </script>
</body>
</html>
